<!doctype html>
<html lang="mn"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Chiglel LLC - Product catalog</title><link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet"><style>
:root{--bg:#f5f3ee;--surface:#fff;--border:#ddd9d0;--text:#1a1a18;--muted:#6b6860;--light:#9b9890;--accent:#c8330a;--accent-bg:#fdf0ec;--blue:#1a4a8a;--blue-bg:#eef3fa;--mono:'IBM Plex Mono',monospace;--sans:'IBM Plex Sans',sans-serif}*{box-sizing:border-box}body{margin:0;font-family:var(--sans);background:var(--bg);color:var(--text)}header{height:56px;background:var(--text);color:#fff;display:flex;align-items:center;justify-content:space-between;padding:0 32px;position:sticky;top:0;z-index:10}.brand{font-family:var(--mono);font-weight:500}.brand span{color:var(--accent);font-size:20px}.toplinks{display:flex;gap:14px;align-items:center}.toplinks a{color:rgba(255,255,255,.65);font:12px var(--mono);text-decoration:none}.admin{background:var(--accent);color:#fff!important;padding:7px 13px;border-radius:4px}.toolbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding:16px 32px;background:var(--surface);border-bottom:1px solid var(--border)}input,select,button{font-family:var(--sans)}.search{flex:1;min-width:240px;max-width:430px;padding:10px 12px;border:1px solid var(--border);border-radius:6px;background:var(--bg)}select,.toggle{padding:10px 12px;border:1px solid var(--border);border-radius:6px;background:var(--bg);color:var(--muted)}.toggle{cursor:pointer}.toggle.active{background:var(--accent-bg);border-color:var(--accent);color:var(--accent)}.stats{margin-left:auto;color:var(--muted);font:12px var(--mono)}.layout{display:flex}.sidebar{width:230px;min-width:230px;background:var(--surface);border-right:1px solid var(--border);padding:18px 0;position:sticky;top:89px;height:calc(100vh - 89px);overflow:auto}.side-label{padding:8px 20px 6px;color:var(--light);font:10px var(--mono);letter-spacing:.1em;text-transform:uppercase}.cat{display:block;width:100%;padding:8px 20px;text-align:left;border:0;background:transparent;color:var(--muted);cursor:pointer;border-left:2px solid transparent}.cat:hover{background:var(--bg);color:var(--text)}.cat.active{background:var(--accent-bg);color:var(--accent);border-left-color:var(--accent);font-weight:500}.count{float:right;color:var(--light);font:10px var(--mono)}main{flex:1;padding:24px 28px}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:14px}.card{display:block;text-decoration:none;color:inherit;background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:16px;transition:.15s}.card:hover{border-color:var(--accent);box-shadow:0 4px 16px #0001;transform:translateY(-1px)}.row{display:flex;justify-content:space-between;gap:8px}.code{font:10px var(--mono);color:var(--light)}.badges{display:flex;gap:4px;flex-wrap:wrap;justify-content:flex-end}.badge{font:500 9px var(--mono);padding:2px 6px;border-radius:3px;letter-spacing:.05em}.mn{background:#e8f3ec;color:#2d7a4f}.cn{background:#fff3e8;color:#b85a00}.pdf{background:var(--blue-bg);color:var(--blue)}.abc{background:#fff8e8;color:#8b6000}.name{min-height:40px;margin:12px 0;font-size:13px;font-weight:500;line-height:1.45;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}.foot{border-top:1px solid var(--bg);padding-top:10px;align-items:center}.price{font:500 14px var(--mono)}.price span{font-size:10px;color:var(--light)}.sub{max-width:110px;color:var(--light);font-size:11px;text-align:right;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.empty,.loading{text-align:center;padding:80px 20px;color:var(--muted)}.pages{display:flex;justify-content:center;gap:6px;flex-wrap:wrap;padding:28px 0}.pg{min-width:34px;height:34px;border:1px solid var(--border);background:var(--surface);border-radius:6px;color:var(--muted);cursor:pointer}.pg.active{background:var(--accent);border-color:var(--accent);color:white}.pg:disabled{opacity:.35;cursor:default}@media(max-width:760px){header,.toolbar{padding-left:16px;padding-right:16px}.sidebar{display:none}main{padding:16px}.toplinks a:not(.admin){display:none}}
</style></head><body><header><div class="brand"><span>C</span> CHIGLEL LLC - PRODUCT CATALOG</div><div class="toplinks"><a href="https://www.chiglel.mn" target="_blank" rel="noopener">chiglel.mn ?</a><a class="admin" href="admin/index.html">Admin</a></div></header><div class="toolbar"><input id="q" class="search" placeholder="Search name, code, model..."><select id="origin"><option value="">All origins</option><option value="&#1052;&#1086;&#1085;&#1075;&#1086;&#1083;">Mongolia</option><option value="&#1061;&#1103;&#1090;&#1072;&#1076;">China</option></select><select id="abc"><option value="">All ABC</option><option>A</option><option>B</option><option>C</option></select><button id="manual" class="toggle" type="button">Has PDF</button><div id="stats" class="stats">Loading...</div></div><div class="layout"><aside id="side" class="sidebar"><div class="side-label">Category</div></aside><main><div id="list" class="loading">Loading products...</div><div id="pages" class="pages"></div></main></div><script>
let all=[],filtered=[],page=1,cat=null,onlyManual=false;const SIZE=48;const $=id=>document.getElementById(id);const t=(tag,text,cls)=>{const e=document.createElement(tag);if(cls)e.className=cls;e.textContent=String(text??'');return e};function productHref(code){const u=new URL('product.html',location.href);u.searchParams.set('code',String(code));return u.href}function badge(parent,label,cls){if(label)parent.appendChild(t('span',label,'badge '+cls))}async function load(){try{all=await (await fetch('data/products.json')).json();buildSide();apply()}catch(e){empty('No products found','Try changing the search or filters')}}function buildSide(){const map={};all.forEach(p=>map[p.category||'?']=(map[p.category||'?']||0)+1);const side=$('side');const allBtn=t('button','All','cat active');allBtn.type='button';allBtn.appendChild(t('span',all.length,'count'));allBtn.onclick=()=>setCat(null,allBtn);side.appendChild(allBtn);Object.entries(map).sort((a,b)=>b[1]-a[1]).forEach(([k,v])=>{const b=t('button',k,'cat');b.type='button';b.appendChild(t('span',v,'count'));b.onclick=()=>setCat(k,b);side.appendChild(b)})}function setCat(next,btn){document.querySelectorAll('.cat').forEach(b=>b.classList.remove('active'));btn.classList.add('active');cat=next;page=1;apply()}function apply(){const q=$('q').value.trim().toLowerCase(),origin=$('origin').value,abc=$('abc').value;filtered=all.filter(p=>{if(cat&&p.category!==cat)return false;if(origin&&p.origin!==origin)return false;if(abc&&p.abc!==abc)return false;if(onlyManual&&!p.manual_url)return false;if(q&&!([p.name,p.code,p.model,p.brand,p.subcategory].filter(Boolean).join(' ').toLowerCase().includes(q)))return false;return true});$('stats').textContent=filtered.length+' / '+all.length+' products';render();pages()}function empty(a,b){const root=$('list');root.textContent='';root.className='empty';root.append(t('h3',a),t('p',b))}function render(){const root=$('list');root.textContent='';root.className='';const slice=filtered.slice((page-1)*SIZE,page*SIZE);if(!slice.length)return empty('No products found','Try changing the search or filters');const grid=document.createElement('div');grid.className='grid';slice.forEach(p=>{const a=document.createElement('a');a.className='card';a.href=productHref(p.code);const row=document.createElement('div');row.className='row';row.appendChild(t('div','#'+p.code,'code'));const badges=document.createElement('div');badges.className='badges';if(p.origin==='\u041c\u043e\u043d\u0433\u043e\u043b')badge(badges,'MN','mn');else if(p.origin==='\u0425\u044f\u0442\u0430\u0434')badge(badges,'CN','cn');if(p.manual_url)badge(badges,'PDF','pdf');if(p.abc)badge(badges,p.abc,'abc');row.appendChild(badges);a.appendChild(row);a.appendChild(t('div',p.name||'-','name'));const foot=document.createElement('div');foot.className='row foot';const price=t('div','', 'price');if(p.price){price.textContent=Number(p.price).toLocaleString();price.appendChild(t('span',' MNT'))}else price.appendChild(t('span','No price'));foot.append(price,t('div',p.subcategory||'','sub'));a.appendChild(foot);grid.appendChild(a)});root.appendChild(grid)}function pages(){const total=Math.ceil(filtered.length/SIZE),root=$('pages');root.textContent='';if(total<=1)return;const mk=(label,p,dis,act)=>{const b=t('button',label,'pg'+(act?' active':''));b.type='button';b.disabled=dis;b.onclick=()=>{page=p;render();pages()};root.appendChild(b)};mk('<',page-1,page===1);for(let i=Math.max(1,page-2);i<=Math.min(total,page+2);i++)mk(i,i,false,i===page);mk('>',page+1,page===total)}$('q').oninput=()=>{page=1;apply()};$('origin').onchange=()=>{page=1;apply()};$('abc').onchange=()=>{page=1;apply()};$('manual').onclick=()=>{onlyManual=!onlyManual;$('manual').classList.toggle('active',onlyManual);page=1;apply()};load();
</script></body></html>
