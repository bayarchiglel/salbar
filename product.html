<!doctype html>
<html lang="mn"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Product - Chiglel LLC</title><link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet"><style>
:root{--bg:#f5f3ee;--surface:#fff;--border:#ddd9d0;--text:#1a1a18;--muted:#6b6860;--light:#9b9890;--accent:#c8330a;--blue:#1a4a8a;--blue-bg:#eef3fa;--mono:'IBM Plex Mono',monospace;--sans:'IBM Plex Sans',sans-serif}*{box-sizing:border-box}body{margin:0;font-family:var(--sans);background:var(--bg);color:var(--text)}header{height:56px;background:var(--text);color:#fff;display:flex;align-items:center;justify-content:space-between;padding:0 32px;position:sticky;top:0;z-index:10}.brand{font-family:var(--mono);font-weight:500}.brand span{color:var(--accent);font-size:20px}.back{color:rgba(255,255,255,.7);text-decoration:none;font:13px var(--mono)}.wrap{max-width:1100px;margin:0 auto;padding:32px 28px 60px}.crumb{font:11px var(--mono);color:var(--light);display:flex;gap:6px;flex-wrap:wrap;margin-bottom:20px}.crumb a{color:var(--muted);text-decoration:none}.layout{display:grid;grid-template-columns:1fr 340px;gap:24px;align-items:start}.card{background:var(--surface);border:1px solid var(--border);border-radius:10px;overflow:hidden;margin-bottom:20px}.head{padding:28px}.code-row{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:12px}.code{font:12px var(--mono);color:var(--light);background:var(--bg);border:1px solid var(--border);border-radius:4px;padding:3px 10px}.badge{font:500 10px var(--mono);padding:3px 8px;border-radius:4px;text-transform:uppercase}.mn{background:#e8f3ec;color:#2d7a4f}.cn{background:#fff3e8;color:#b85a00}.pdf{background:var(--blue-bg);color:var(--blue)}.abc{background:#fff8e8;color:#8b6000}h1{font-size:22px;line-height:1.35;margin:0 0 8px}.cat{color:var(--muted);font-size:13px;margin-bottom:20px}.price-row{border-top:1px solid var(--bg);padding-top:16px;display:flex;align-items:baseline;gap:8px}.price{font:500 28px var(--mono)}.unit{font:14px var(--mono);color:var(--muted)}.title{padding:14px 20px;border-bottom:1px solid var(--border);background:var(--bg);font:11px var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}table{width:100%;border-collapse:collapse}td{padding:11px 20px;border-bottom:1px solid var(--bg);font-size:13px;vertical-align:top}td:first-child{color:var(--muted);width:40%}td:last-child{font:500 12.5px var(--mono)}.pdfbox{aspect-ratio:3/4;background:#f0ede8}.pdfbox iframe{width:100%;height:100%;border:0}.actions{display:flex;flex-direction:column;gap:8px;padding:14px 16px}.btn{display:flex;justify-content:center;align-items:center;gap:8px;padding:11px 16px;border-radius:6px;text-decoration:none;font-size:13.5px}.primary{background:var(--accent);color:#fff}.secondary{background:#fff;color:var(--text);border:1px solid var(--border)}.contact{padding:16px}.contact div{padding:8px 0;border-bottom:1px solid var(--bg);font-size:13px}.contact div:last-child{border-bottom:0}.label{display:block;color:var(--light);font-size:11px}.loading,.empty{text-align:center;padding:80px;color:var(--muted)}@media(max-width:900px){.layout{grid-template-columns:1fr}.wrap{padding:20px 16px 40px}header{padding:0 16px}}
</style></head><body><header><div class="brand"><span>C</span> CHIGLEL LLC</div><a class="back" href="index.html">Back to catalog</a></header><main id="root" class="wrap"><div class="loading">Loading...</div></main><script>
const $=id=>document.getElementById(id);const t=(tag,text,cls)=>{const e=document.createElement(tag);if(cls)e.className=cls;e.textContent=String(text??'');return e};function safeUrl(raw){try{const u=new URL(raw);return ['http:','https:'].includes(u.protocol)?u.href:''}catch{return ''}}function driveId(raw){const href=safeUrl(raw);if(!href)return '';const u=new URL(href);if(!u.hostname.includes('drive.google.com'))return '';const m=u.pathname.match(new RegExp('/file/d/([^/]+)'));return m?m[1]:(u.searchParams.get('id')||'')}function manualLinks(raw){const href=safeUrl(raw);if(!href)return null;const id=driveId(href);return id?{preview:'https://drive.google.com/file/d/'+encodeURIComponent(id)+'/preview',download:'https://drive.google.com/uc?export=download&id='+encodeURIComponent(id),open:'https://drive.google.com/file/d/'+encodeURIComponent(id)+'/view'}:{preview:href,download:href,open:href}}function badge(row,label,cls){if(label)row.appendChild(t('span',label,'badge '+cls))}function spec(body,label,value){if(value===null||value===undefined||value==='')return;const tr=document.createElement('tr');tr.append(t('td',label),t('td',value));body.appendChild(tr)}function tableCard(title,body){const c=document.createElement('section');c.className='card';c.appendChild(t('div',title,'title'));const table=document.createElement('table');table.appendChild(body);c.appendChild(table);return c}function notFound(code){const root=$('root');root.textContent='';const e=t('div','','empty');e.append(t('h3','Product not found (#'+code+')'));const a=t('a','Back to catalog');a.href='index.html';a.style.color='var(--accent)';e.appendChild(a);root.appendChild(e)}
async function init(){const code=new URLSearchParams(location.search).get('code');if(!code){location.href='index.html';return}const products=await (await fetch('data/products.json')).json();const p=products.find(x=>String(x.code)===String(code));if(!p)return notFound(code);document.title=(p.name||p.code)+' - Chiglel LLC';render(p)}function render(p){const root=$('root');root.textContent='';const crumb=document.createElement('div');crumb.className='crumb';const home=t('a','Catalog');home.href='index.html';crumb.append(home,document.createTextNode('/'),t('span',p.category||'-'),document.createTextNode('/'),t('span',p.subcategory||'-'));root.appendChild(crumb);const layout=document.createElement('div');layout.className='layout';const left=document.createElement('div');const head=document.createElement('section');head.className='card head';const row=document.createElement('div');row.className='code-row';row.appendChild(t('span','#'+p.code,'code'));if(p.origin==='\u041c\u043e\u043d\u0433\u043e\u043b')badge(row,'Mongolia','mn');else if(p.origin==='\u0425\u044f\u0442\u0430\u0434')badge(row,'China','cn');if(p.abc)badge(row,'ABC: '+p.abc,'abc');if(p.manual_url)badge(row,'PDF','pdf');head.appendChild(row);head.appendChild(t('h1',p.name||'-'));const cat=t('div','', 'cat');cat.appendChild(t('strong',p.category||'-'));if(p.subcategory)cat.appendChild(document.createTextNode(' / '+p.subcategory));head.appendChild(cat);if(p.price){const pr=document.createElement('div');pr.className='price-row';pr.append(t('div',Number(p.price).toLocaleString(),'price'),t('div','MNT / unit','unit'));head.appendChild(pr)}left.appendChild(head);const info=document.createElement('tbody');spec(info,'Code','#'+p.code);spec(info,'Location',p.location);spec(info,'Category',p.category);spec(info,'Subcategory',p.subcategory);spec(info,'Origin',p.origin);spec(info,'Brand',p.brand);spec(info,'Model',p.model);spec(info,'Features',p.features);if(info.children.length)left.appendChild(tableCard('General information',info));const dims=[];if(p.dims?.length)dims.push(p.dims.length+'mm length');if(p.dims?.width)dims.push(p.dims.width+'mm width');if(p.dims?.height)dims.push(p.dims.height+'mm height');const tech=document.createElement('tbody');spec(tech,'Dimensions',dims.length?dims.join(' x '):null);spec(tech,'Weight',p.weight?p.weight+' kg':null);spec(tech,'Voltage',p.voltage?p.voltage+'V':null);spec(tech,'Power',p.power_kw?p.power_kw+' kW':null);if(tech.children.length)left.appendChild(tableCard('Technical specifications',tech));const links=manualLinks(p.manual_url);if(links){const pdf=document.createElement('section');pdf.className='card';pdf.appendChild(t('div','User Manual','title'));const box=document.createElement('div');box.className='pdfbox';const iframe=document.createElement('iframe');iframe.src=links.preview;iframe.allowFullscreen=true;box.appendChild(iframe);pdf.appendChild(box);const actions=document.createElement('div');actions.className='actions';const dl=t('a','Download PDF','btn primary');dl.href=links.download;dl.target='_blank';dl.rel='noopener';const open=t('a','Open in Google Drive','btn secondary');open.href=links.open;open.target='_blank';open.rel='noopener';actions.append(dl,open);pdf.appendChild(actions);left.appendChild(pdf)}const right=document.createElement('aside');const contact=document.createElement('section');contact.className='card';contact.appendChild(t('div','Contact','title'));const body=document.createElement('div');body.className='contact';[['Phone','+976 7611 5333'],['Mobile','+976 9133 5333'],['Email','info@chiglel.mn'],['Web','chiglel.mn']].forEach(([l,v])=>{const d=document.createElement('div');d.append(t('span',l,'label'),t('strong',v));body.appendChild(d)});contact.appendChild(body);right.appendChild(contact);layout.append(left,right);root.appendChild(layout)}init();
</script></body></html>
